<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>海边碰撞编辑器</title><link rel="stylesheet" href="css/sea-collision-editor.css"></head><body>
<header><h1>海边碰撞编辑器</h1><p>点击红框选中，拖框移动，拉动边角缩放。红色区域不能走；紫色是人物脚下的固定碰撞。</p><nav><button id="add">添加碰撞框</button><button id="remove">删除选中</button><button id="undo">撤销</button><button id="redo">重做</button><button id="save">保存并应用</button><a id="preview" href="ending.html?ending=good&part=epilogue" target="_blank">保存并试玩 ↗</a><button id="export">导出正式脚本</button><button id="reset">恢复原版</button></nav></header>
<main><section class="canvas-wrap"><div id="map" role="group" aria-label="可编辑的海边碰撞地图"><img id="background" alt="海边地图" draggable="false"><div id="rectangles"></div><div id="fixed"></div><div id="spawn" title="莱纳初始位置">起点</div></div></section><aside><h2>选中区域</h2><p id="selection">点击任意红框</p><div class="numbers"><label>横向位置<input id="x" type="number" step="1"></label><label>纵向位置<input id="y" type="number" step="1"></label><label>宽度<input id="width" type="number" min="12" step="1"></label><label>高度<input id="height" type="number" min="12" step="1"></label></div><p>方向键微调，Shift＋方向键移动 10 格。Delete 删除，Ctrl＋Z 撤销。</p><p>保存后，同一浏览器打开的好结局会使用这些碰撞框。已打开的试玩页需要刷新。</p><p>分享给同学：导出后替换游戏的 <code>js/endings/good.js</code>。只改变碰撞区域，保留剧情和人物。</p><p id="status" role="status"></p></aside></main>
<script src="js/endings/good.js?v=sea-20261009c"></script><script src="js/sea-collision-editor.js"></script></body></html>
