<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>档案母版与切片 Debug 对比</title>
  <link rel="icon" href="data:,">
  <style>
    *{box-sizing:border-box}
    body{min-height:100vh;margin:0;padding:20px;color:#e7dcc3;background:#0c0c0b;font-family:"Microsoft YaHei",sans-serif}
    main{width:min(1500px,100%);margin:auto}
    header{display:flex;align-items:end;justify-content:space-between;gap:20px;margin-bottom:18px}
    h1{margin:0;font:700 25px/1.3 Georgia,"Microsoft YaHei",serif}
    p{margin:5px 0;color:#b9aa8e;font-size:13px}
    a{padding:8px 12px;border:1px solid #8f7650;color:#e7d5b2;text-decoration:none;background:#262019}
    .compare{display:grid;grid-template-columns:1fr 1fr;gap:24px;align-items:start}
    figure{margin:0;padding:14px;border:1px solid #69583e;background:#17140f;box-shadow:0 12px 32px #0008}
    figcaption{margin-bottom:10px;color:#d4bb87;font:700 13px/1.3 monospace}
    .full,.assembly{display:block;width:100%;aspect-ratio:3/2}
    .full{object-fit:contain;background:#090908}
    .assembly{display:grid;grid-template-columns:repeat(3,1fr);grid-template-rows:repeat(2,1fr);overflow:hidden;background:#090908}
    .piece{position:relative;min-width:0;min-height:0}
    .piece img{position:absolute;left:-5%;top:-5%;width:110%;height:110%;object-fit:fill;filter:drop-shadow(0 0 .5px rgba(20,15,10,.3))}
    .checks{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px;color:#cdbc99;font-size:12px}
    .checks span{padding:5px 8px;border:1px solid #54462f;background:#18150f}
    @media(max-width:850px){.compare{grid-template-columns:1fr}header{align-items:flex-start;flex-direction:column}}
  </style>
</head>
<body>
  <main>
    <header><div><h1>档案母版 / 六块真实切片</h1><p>右侧六张PNG按原始坐标拼合；断口、文字、折痕和印章应与左侧母版一致。</p></div><a href="debug-archive-restoration.html">返回小游戏 Debug</a></header>
    <section class="compare">
      <figure><figcaption>完整母版 · archive_full.webp · 1200×800</figcaption><img class="full" src="images/minigames/archive-puzzle/archive_full.webp" alt="第七码头转运记录完整母版"></figure>
      <figure><figcaption>六块透明PNG · 正确顺序 3×2 拼合</figcaption><div class="assembly" aria-label="按正确顺序拼好的六块档案碎片">
        <div class="piece"><img src="images/minigames/archive-puzzle/archive_piece_01.png" alt="碎片1"></div>
        <div class="piece"><img src="images/minigames/archive-puzzle/archive_piece_02.png" alt="碎片2"></div>
        <div class="piece"><img src="images/minigames/archive-puzzle/archive_piece_03.png" alt="碎片3"></div>
        <div class="piece"><img src="images/minigames/archive-puzzle/archive_piece_04.png" alt="碎片4"></div>
        <div class="piece"><img src="images/minigames/archive-puzzle/archive_piece_05.png" alt="碎片5"></div>
        <div class="piece"><img src="images/minigames/archive-puzzle/archive_piece_06.png" alt="碎片6"></div>
      </div></figure>
    </section>
    <div class="checks"><span>共享撕裂边界</span><span>标题跨1/2</span><span>批次跨2/3</span><span>来源跨1/4</span><span>净化跨4/5</span><span>地点跨5/6</span><span>印章跨2/3/5/6</span></div>
  </main>
</body>
</html>
