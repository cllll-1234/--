<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>登录 | 进击的巨人</title>
  <link rel="stylesheet" href="css/common.css"><link rel="stylesheet" href="css/form.css"><link rel="stylesheet" href="css/responsive.css">
</head>
<body>
  <header class="site-header"><a class="brand" href="index.html"><span class="brand-mark"><span>墙</span></span>进击的巨人</a><nav><ul><li><a href="index.html">主页</a></li><li><a href="register.html">注册</a></li></ul></nav></header>
  <main class="form-page">
    <form id="login-form" class="form-card panel">
      <header><p class="eyebrow">Identity Check</p><h1>返回高墙</h1><p class="muted">登录后，不同成员的剧情存档将分别保存。</p></header>
      <div class="form-group"><label for="login-username">用户名</label><input id="login-username" name="username" autocomplete="username" minlength="1" required></div>
      <div class="form-group"><label for="login-password">密码</label><input id="login-password" name="password" type="password" autocomplete="current-password" minlength="1" required></div>
      <label class="check-row"><input name="remember" type="checkbox">记住我的用户名</label>
      <p id="form-message" class="form-message" role="status"></p>
      <div class="form-actions"><button class="button" type="submit">登录</button><a class="button ghost" href="register.html">创建新身份</a><a class="button ghost" href="index.html">返回主页</a></div>
    </form>
  </main>
  <script src="js/auth.js"></script>
</body>
</html>
