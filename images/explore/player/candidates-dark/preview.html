<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>主角暗色候选 · 三版对比</title>
  <style>
    *{box-sizing:border-box}body{margin:0;padding:40px 5vw;background:#080b0a;color:#d9d3c6;font-family:"Microsoft YaHei",sans-serif}h1{font-size:26px;font-weight:400}p{color:#aaa59b;line-height:1.8}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:18px}.card{padding:18px;border:1px solid #393b32;background:#101411}.map{height:240px;display:flex;align-items:center;justify-content:center;background:linear-gradient(#0003,#0003),url('../../../maps/oldtown.png') center/cover}.map img{height:105px;width:auto;max-width:110px;object-fit:contain;image-rendering:pixelated}.large{height:300px;display:flex;justify-content:center;align-items:center;background:#0b100e}.large img{height:280px;max-width:100%;object-fit:contain;image-rendering:pixelated}h2{font-size:18px;font-weight:400}.label{font-size:12px;color:#908b7f}@media(max-width:900px){.grid{grid-template-columns:repeat(2,1fr)}}@media(max-width:500px){.grid{grid-template-columns:1fr}}
  </style>
</head>
<body>
  <h1>主角暗色候选 · 三版对比</h1>
  <p>上方是地图氛围示意，下方是放大细节。三个候选为正面静止姿态预览，供选择色调。</p>
  <div class="grid">
    <section class="card"><h2>当前原图</h2><div class="map"><img src="../v2/reiner_idle_down.png" alt="当前原图"></div><div class="large"><img src="../v2/reiner_idle_down.png" alt="当前原图放大"></div></section>
    <section class="card"><h2>A · 冷灰</h2><div class="map"><img src="reiner-A-cold.png" alt="冷灰版地图示意"></div><div class="large"><img src="reiner-A-cold.png" alt="冷灰版细节"></div><p class="label">灰色裤装 · 冷色阴影 · 克制的边缘光</p></section>
    <section class="card"><h2>B · 旧棕</h2><div class="map"><img src="reiner-B-weathered.png" alt="旧棕版地图示意"></div><div class="large"><img src="reiner-B-weathered.png" alt="旧棕版细节"></div><p class="label">灰褐裤装 · 旧皮革 · 暖灰色调</p></section>
    <section class="card"><h2>C · 深灰绿</h2><div class="map"><img src="reiner-C-olive.png" alt="深灰绿版地图示意"></div><div class="large"><img src="reiner-C-olive.png" alt="深灰绿版细节"></div><p class="label">灰绿裤装 · 深色外套 · 更沉暗的整体明度</p></section>
  </div>
</body>
</html>
